<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repaso Estudios Sociales - Zona de Los Santos</title>
    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti (via CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <style>
        /* Animaciones personalizadas */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .slide-in {
            animation: slideInRight 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <!-- Contenedor principal de la App -->
    <div id="app" class="min-h-screen flex items-center justify-center p-4"></div>

    <script>
        // --- BASE DE DATOS DE PREGUNTAS ---
        const questions = [
            {
                id: 'q1',
                type: 'multiple-choice',
                question: 'Una estudiante camina por San Isidro de León Cortés y observa montañas, terrenos elevados, pendientes y valles. ¿Cuál característica del relieve identifica mejor a la Zona de Los Santos?',
                options: [
                    'A. Grandes llanuras completamente planas.',
                    'B. Relieve montañoso con pendientes, valles y terrenos elevados.',
                    'C. Desiertos con grandes extensiones de arena.',
                    'D. Terrenos costeros con playas extensas.'
                ],
                correctAnswer: 'B. Relieve montañoso con pendientes, valles y terrenos elevados.',
                explanation: 'La Zona de Los Santos se caracteriza por su topografía accidentada y montañosa, ideal para cultivos como el café.'
            },
            {
                id: 'q2',
                type: 'multiple-choice',
                question: '¿Qué entendemos por región?',
                options: [
                    'A. Un espacio geográfico que comparte determinadas características.',
                    'B. Un lugar donde solamente existen viviendas.',
                    'C. Una división que únicamente sirve para separar provincias.',
                    'D. Un territorio que siempre tiene exactamente el mismo clima.'
                ],
                correctAnswer: 'A. Un espacio geográfico que comparte determinadas características.',
                explanation: 'Una región es una zona territorial que se agrupa porque sus partes comparten elementos en común, ya sean físicos, económicos o sociales.'
            },
            {
                id: 'q3',
                type: 'multiple-choice',
                question: 'Un grupo de estudiantes clasifica un territorio tomando en cuenta la temperatura, las lluvias y otras condiciones atmosféricas. ¿Según cuál elemento están identificando una región?',
                options: [
                    'A. Económico.',
                    'B. Arqueológico.',
                    'C. Climático.',
                    'D. Educativo.'
                ],
                correctAnswer: 'C. Climático.',
                explanation: 'La temperatura y las lluvias son elementos meteorológicos que determinan el clima de una región.'
            },
            {
                id: 'q4',
                type: 'multiple-choice',
                question: 'En una comunidad existen numerosas fincas de café, beneficios, productores, recolectores y comercios relacionados con esta actividad. ¿Qué elemento permite caracterizar principalmente esta región?',
                options: [
                    'A. Económico-productivo.',
                    'B. Arqueológico.',
                    'C. Climático.',
                    'D. Educativo.'
                ],
                correctAnswer: 'A. Económico-productivo.',
                explanation: 'Las actividades relacionadas con el cultivo y procesamiento del café son actividades productivas que generan economía.'
            },
            {
                id: 'q5',
                type: 'multiple-choice',
                question: 'San Isidro pertenece al cantón de León Cortés Castro, ubicado en la Zona de Los Santos. ¿A cuál región socioeconómica pertenece León Cortés?',
                options: [
                    'A. Región Brunca.',
                    'B. Región Chorotega.',
                    'C. Región Central.',
                    'D. Región Huetar Norte.'
                ],
                correctAnswer: 'C. Región Central.',
                explanation: 'La Zona de Los Santos (Dota, Tarrazú y León Cortés) forma parte de la Región Central de Costa Rica.'
            },
            {
                id: 'q6',
                type: 'multiple-choice',
                question: '¿Cuál de las siguientes opciones presenta correctamente las regiones socioeconómicas de Costa Rica?',
                options: [
                    'A. Central, Brunca, Chorotega, Pacífico Central, Huetar Norte y Huetar Caribe.',
                    'B. Norte, Sur, Este, Oeste, Central y Costera.',
                    'C. San José, Alajuela, Cartago, Heredia, Limón y Puntarenas.',
                    'D. Valle Central, Zona Norte, Zona Sur y Zona Atlántica.'
                ],
                correctAnswer: 'A. Central, Brunca, Chorotega, Pacífico Central, Huetar Norte y Huetar Caribe.',
                explanation: 'Costa Rica se divide oficialmente en 6 regiones socioeconómicas establecidas por MIDEPLAN.'
            },
            {
                id: 'q7',
                type: 'multiple-choice',
                question: 'El cultivo y producción de café han tenido gran importancia en la Zona de Los Santos. ¿Cuál es una razón que explica esta importancia?',
                options: [
                    'A. Es una región dedicada principalmente a la pesca.',
                    'B. El café ha sido una actividad productiva importante para muchas familias y para la economía regional.',
                    'C. La región no posee terrenos adecuados para la agricultura.',
                    'D. La principal actividad económica de la región siempre ha sido la minería.'
                ],
                correctAnswer: 'B. El café ha sido una actividad productiva importante para muchas familias y para la economía regional.',
                explanation: 'El café de esta zona (reconocido mundialmente) es el principal motor económico y fuente de sustento de las familias.'
            },
            {
                id: 'q8',
                type: 'multiple-choice',
                question: 'En 1969 ocurrió un acontecimiento que tuvo gran importancia para las comunidades de la Zona de Los Santos. ¿Cuál fue?',
                options: [
                    'A. Se creó el cantón de León Cortés.',
                    'B. Llegó la electricidad a la Zona de Los Santos.',
                    'C. Costa Rica declaró su independencia.',
                    'D. Se fundó la primera escuela de Costa Rica.'
                ],
                correctAnswer: 'B. Llegó la electricidad a la Zona de Los Santos.',
                explanation: 'En 1969, la llegada de COOPELESCA/COOPESANTOS trajo la electrificación, impulsando el desarrollo.'
            },
            {
                id: 'q9',
                type: 'multiple-choice',
                question: '¿Por qué la llegada de la electricidad fue importante para las comunidades de la Zona de Los Santos?',
                options: [
                    'A. Porque permitió mejorar diferentes actividades de la vida cotidiana, productivas y sociales.',
                    'B. Porque eliminó completamente la agricultura.',
                    'C. Porque convirtió la región en una zona costera.',
                    'D. Porque hizo desaparecer las montañas.'
                ],
                correctAnswer: 'A. Porque permitió mejorar diferentes actividades de la vida cotidiana, productivas y sociales.',
                explanation: 'La electricidad permitió el uso de maquinaria en los beneficios de café y mejoró la calidad de vida en los hogares.'
            },
            {
                id: 'q10',
                type: 'multiple-choice',
                question: 'En 1910 ocurrieron fuertes terremotos en Costa Rica que provocaron daños en diferentes comunidades. ¿Qué nos permite comprender este acontecimiento?',
                options: [
                    'A. Que los fenómenos naturales pueden afectar la vida de las personas y transformar las comunidades.',
                    'B. Que los terremotos solamente afectan las zonas costeras.',
                    'C. Que los terremotos no producen daños en las construcciones.',
                    'D. Que los acontecimientos naturales no forman parte de la historia de una región.'
                ],
                correctAnswer: 'A. Que los fenómenos naturales pueden afectar la vida de las personas y transformar las comunidades.',
                explanation: 'Los fenómenos naturales son parte de la historia porque cambian la infraestructura y la forma en que viven las personas.'
            },
            {
                id: 'q11',
                type: 'true-false',
                question: 'La Zona de Los Santos está formada únicamente por el cantón de León Cortés.',
                correctAnswer: false,
                explanation: 'Falso. La Zona de Los Santos está conformada por tres cantones: León Cortés, Tarrazú y Dota.'
            },
            {
                id: 'q12',
                type: 'true-false',
                question: 'León Cortés Castro forma parte de la Región Central de Costa Rica.',
                correctAnswer: true,
                explanation: 'Verdadero. Toda la Zona de Los Santos está ubicada geográficamente en la Región Central.'
            },
            {
                id: 'q13',
                type: 'true-false',
                question: 'El cultivo y producción de café constituyen actividades económicas importantes en la Zona de Los Santos.',
                correctAnswer: true,
                explanation: 'Verdadero. Es la principal actividad económica de la región.'
            },
            {
                id: 'q14',
                type: 'true-false',
                question: 'Una región solamente puede definirse utilizando límites políticos.',
                correctAnswer: false,
                explanation: 'Falso. Una región puede definirse por el clima, relieve, cultura, o actividades económicas, no solo por límites políticos.'
            },
            {
                id: 'q15',
                type: 'true-false',
                question: 'Las características del relieve pueden influir en las actividades que realizan las personas de una comunidad.',
                correctAnswer: true,
                explanation: 'Verdadero. Por ejemplo, el relieve montañoso de la zona favorece el cultivo del café pero dificulta el transporte.'
            },
            {
                id: 'q16',
                type: 'true-false',
                question: 'La llegada de la electricidad a la Zona de Los Santos en 1969 fue un acontecimiento sin importancia para el desarrollo de la región.',
                correctAnswer: false,
                explanation: 'Falso. Fue un acontecimiento de gran importancia porque mejoró los procesos productivos y la calidad de vida.'
            },
            {
                id: 'q17',
                type: 'short-answer',
                question: 'Menciona dos características del relieve que podemos encontrar en la Zona de Los Santos.',
                description: 'Escribe una palabra clave en cada espacio (ej. montañas, valles, pendientes).',
                inputs: [
                    { label: 'Característica 1', correctAnswers: ['montaña', 'montañas', 'montañoso', 'valle', 'valles', 'pendiente', 'pendientes', 'elevado', 'elevados', 'terreno elevado', 'terrenos elevados'] },
                    { label: 'Característica 2', correctAnswers: ['montaña', 'montañas', 'montañoso', 'valle', 'valles', 'pendiente', 'pendientes', 'elevado', 'elevados', 'terreno elevado', 'terrenos elevados'] }
                ],
                explanation: 'El relieve de la Zona de Los Santos es montañoso, caracterizado por valles y pendientes.'
            },
            {
                id: 'q18',
                type: 'short-answer',
                question: 'Secuencia territorial: Completa la siguiente secuencia.',
                description: 'San Isidro → _________ → Zona de Los Santos → _________ → Costa Rica',
                inputs: [
                    { label: 'Cantón', correctAnswers: ['león cortés', 'leon cortes', 'leon', 'león'] },
                    { label: 'Región socioeconómica', correctAnswers: ['central', 'región central', 'region central'] }
                ],
                explanation: 'San Isidro pertenece al cantón de León Cortés. La Zona de Los Santos forma parte de la Región Central de Costa Rica.'
            },
            {
                id: 'q19',
                type: 'matching',
                question: 'Relaciona los conceptos con sus definiciones correctas.',
                pairs: [
                    { concept: 'Región climática', definition: 'Se establece considerando elementos como temperatura, precipitaciones y clima.' },
                    { concept: 'Región arqueológica', definition: 'Se relaciona con sitios, restos y evidencias de sociedades del pasado.' },
                    { concept: 'Región educativa', definition: 'Se relaciona con instituciones, centros educativos y la educación.' },
                    { concept: 'Región económica-productiva', definition: 'Toma en cuenta las actividades económicas y productivas que predominan.' },
                    { concept: 'Región socioeconómica', definition: 'Divide el territorio tomando en cuenta características económicas y sociales.' },
                    { concept: 'Región', definition: 'Espacio geográfico que comparte determinadas características.' },
                    { concept: 'Relieve', definition: 'Características de la superficie terrestre, como montañas, valles y llanuras.' },
                    { concept: 'Historia regional', definition: 'Estudia acontecimientos importantes ocurridos en un territorio y su impacto.' }
                ],
                explanation: 'Identificar los diferentes tipos de regiones y conceptos geográficos es clave para entender cómo se organiza y estudia el territorio nacional.'
            }
        ];

        // --- ICONOS SVG ---
        const icons = {
            bookOpen: `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-600"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>`,
            play: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>`,
            awardBig: `<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-amber-500"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>`,
            awardSmall: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>`,
            rotateCcw: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>`,
            chevronRight: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>`,
            checkCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-green-600 shrink-0 mt-0.5"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>`,
            xCircle: `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-red-600 shrink-0 mt-0.5"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>`,
            send: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>`
        };

        // --- ESTADO Y LÓGICA DE LA APLICACIÓN ---
        let state = {
            status: 'start', // Estados posibles: 'start', 'playing', 'finished'
            currentIndex: 0,
            score: 0,
            isAnswered: false,
            currentIsCorrect: null
        };

        const appEl = document.getElementById('app');

        // Función principal de renderizado
        function render() {
            if (state.status === 'start') {
                appEl.className = "min-h-screen flex items-center justify-center p-4 w-full";
                appEl.innerHTML = `
                    <div class="bg-white rounded-3xl shadow-xl max-w-lg w-full p-8 text-center border border-slate-100 fade-in">
                        <div class="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center mx-auto mb-6">
                            ${icons.bookOpen}
                        </div>
                        <h1 class="text-3xl font-bold text-slate-800 mb-4">Repaso Estudios Sociales</h1>
                        <p class="text-slate-600 mb-8 text-lg">Tema: Relieve, regiones e historia regional de Costa Rica (Zona de Los Santos).</p>
                        <button onclick="startQuiz()" class="w-full flex items-center justify-center gap-2 bg-indigo-600 text-white p-4 rounded-2xl font-bold text-lg hover:bg-indigo-700 transition-all hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-indigo-200">
                            <span>Comenzar Repaso</span>
                            ${icons.play}
                        </button>
                    </div>
                `;
            } else if (state.status === 'finished') {
                appEl.className = "min-h-screen flex items-center justify-center p-4 w-full";
                appEl.innerHTML = `
                    <div class="bg-white rounded-3xl shadow-xl max-w-lg w-full p-8 text-center border border-slate-100 fade-in">
                        <div class="w-24 h-24 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-6">
                            ${icons.awardBig}
                        </div>
                        <h1 class="text-3xl font-bold text-slate-800 mb-2">¡Completado!</h1>
                        <p class="text-slate-500 mb-8">Has terminado el repaso interactivo.</p>
                        
                        <div class="bg-slate-50 rounded-2xl p-6 mb-8 border border-slate-100">
                            <div class="text-5xl font-black text-indigo-600 mb-2">
                                ${state.score} <span class="text-2xl text-slate-400">/ ${questions.length}</span>
                            </div>
                            <div class="text-slate-600 font-medium">Puntos obtenidos</div>
                        </div>

                        <button onclick="restartQuiz()" class="w-full flex items-center justify-center gap-2 bg-indigo-600 text-white p-4 rounded-2xl font-bold text-lg hover:bg-indigo-700 transition-all hover:scale-[1.02] active:scale-[0.98] shadow-lg shadow-indigo-200">
                            ${icons.rotateCcw}
                            <span>Volver a intentar</span>
                        </button>
                    </div>
                `;
            } else if (state.status === 'playing') {
                appEl.className = "min-h-screen w-full flex justify-center py-8 px-4 sm:px-6 md:py-12";
                
                const question = questions[state.currentIndex];
                const progress = (state.currentIndex / questions.length) * 100;
                
                appEl.innerHTML = `
                    <div class="max-w-3xl mx-auto w-full">
                        <!-- Cabecera -->
                        <div class="flex items-center justify-between mb-8 bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-indigo-100 rounded-full flex items-center justify-center">
                                    <span class="font-bold text-indigo-700">${state.currentIndex + 1}</span>
                                </div>
                                <div class="text-sm font-semibold text-slate-500">
                                    de ${questions.length} preguntas
                                </div>
                            </div>
                            <div class="flex items-center gap-2 font-bold text-amber-600 bg-amber-50 px-4 py-2 rounded-xl">
                                ${icons.awardSmall}
                                <span>${state.score} pts</span>
                            </div>
                        </div>
                        
                        <!-- Barra de progreso -->
                        <div class="w-full h-2 bg-slate-200 rounded-full mb-8 overflow-hidden">
                            <div class="h-full bg-indigo-500 transition-all duration-500 ease-out" style="width: ${progress}%"></div>
                        </div>
                        
                        <!-- Tarjeta de Pregunta -->
                        <div class="bg-white rounded-3xl shadow-xl p-6 md:p-10 border border-slate-100 slide-in" id="question-card">
                            <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-8 leading-tight">
                                ${question.question}
                            </h2>

                            <div id="question-content"></div>
                            
                            <div id="feedback-container"></div>
                            
                            <div id="next-button-container" class="mt-10 flex justify-end"></div>
                        </div>
                    </div>
                `;
                
                renderQuestionContent(question);
            }
        }

        function renderQuestionContent(question) {
            const container = document.getElementById('question-content');
            
            if (question.type === 'multiple-choice') {
                let html = '<div class="flex flex-col gap-3">';
                question.options.forEach((option, index) => {
                    const escapedOption = option.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    html += `
                        <button id="opt-${index}" onclick="handleMultipleChoice('${escapedOption}', ${index})" class="w-full text-left p-4 rounded-xl border-2 transition-all duration-200 border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 bg-white text-slate-700">
                            ${option}
                        </button>`;
                });
                html += '</div>';
                container.innerHTML = html;
            } 
            else if (question.type === 'true-false') {
                container.innerHTML = `
                    <div class="grid grid-cols-2 gap-4">
                        <button id="opt-true" onclick="handleTrueFalse(true)" class="w-full text-center p-6 rounded-xl border-2 transition-all duration-200 text-lg font-medium border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 bg-white text-slate-700">
                            Verdadero
                        </button>
                        <button id="opt-false" onclick="handleTrueFalse(false)" class="w-full text-center p-6 rounded-xl border-2 transition-all duration-200 text-lg font-medium border-slate-200 hover:border-indigo-300 hover:bg-indigo-50 bg-white text-slate-700">
                            Falso
                        </button>
                    </div>
                `;
            } 
            else if (question.type === 'short-answer') {
                let html = '<div class="flex flex-col gap-6">';
                if (question.description) {
                    html += `<p class="text-slate-600 text-sm mb-2">${question.description}</p>`;
                }
                html += '<div class="flex flex-col gap-4">';
                question.inputs.forEach((input, index) => {
                    html += `
                        <div class="flex flex-col gap-1">
                            ${input.label ? `<label class="text-sm font-semibold text-slate-500 uppercase tracking-wider pl-1">${input.label}</label>` : ''}
                            <input id="sa-${index}" type="text" placeholder="Escribe tu respuesta..." class="w-full p-4 rounded-xl border-2 outline-none transition-all duration-200 text-lg border-slate-200 focus:border-indigo-500 bg-white text-slate-800" />
                        </div>
                    `;
                });
                html += `</div>
                    <button id="sa-submit" onclick="handleShortAnswer()" class="flex items-center justify-center gap-2 w-full p-4 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition-colors">
                        <span>Revisar respuesta</span>
                        ${icons.send}
                    </button>
                </div>`;
                container.innerHTML = html;
            } 
            else if (question.type === 'matching') {
                window.currentShuffledDefs = [...question.pairs].map(p => p.definition).sort(() => Math.random() - 0.5);
                
                let html = '<div class="flex flex-col gap-6"><div class="flex flex-col gap-4">';
                question.pairs.forEach((pair, index) => {
                    html += `
                        <div class="flex flex-col md:flex-row md:items-center gap-2 p-3 bg-slate-50 rounded-xl border border-slate-100">
                            <div class="md:w-1/3 font-semibold text-slate-700">${pair.concept}</div>
                            <div class="md:w-2/3 flex flex-col gap-1">
                                <select id="match-${index}" class="w-full p-3 rounded-xl border-2 outline-none transition-all duration-200 text-sm border-slate-200 focus:border-indigo-500 bg-white text-slate-800">
                                    <option value="" disabled selected>Selecciona la definición...</option>
                                    ${window.currentShuffledDefs.map(def => `<option value="${def.replace(/"/g, '&quot;')}">${def}</option>`).join('')}
                                </select>
                            </div>
                        </div>
                    `;
                });
                html += `</div>
                    <button id="match-submit" onclick="handleMatching()" class="flex items-center justify-center gap-2 w-full p-4 bg-indigo-600 text-white rounded-xl font-semibold hover:bg-indigo-700 transition-colors">
                        <span>Revisar respuestas</span>
                        ${icons.send}
                    </button>
                </div>`;
                container.innerHTML = html;
            }
        }

        function completeQuestion(isCorrect) {
            state.isAnswered = true;
            state.currentIsCorrect = isCorrect;
            
            if (isCorrect) {
                state.score++;
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#4f46e5', '#10b981', '#f59e0b']
                    });
                }
            }

            const question = questions[state.currentIndex];
            
            const feedbackContainer = document.getElementById('feedback-container');
            feedbackContainer.innerHTML = `
                <div class="mt-6 p-4 rounded-xl flex items-start gap-3 fade-in ${isCorrect ? 'bg-green-50 border border-green-200' : 'bg-red-50 border border-red-200'}">
                    ${isCorrect ? icons.checkCircle : icons.xCircle}
                    <div>
                        <h4 class="font-semibold text-lg ${isCorrect ? 'text-green-800' : 'text-red-800'}">
                            ${isCorrect ? '¡Excelente!' : 'Casi lo logras'}
                        </h4>
                        <p class="mt-1 ${isCorrect ? 'text-green-700' : 'text-red-700'}">
                            ${question.explanation}
                        </p>
                    </div>
                </div>
            `;

            const nextBtnContainer = document.getElementById('next-button-container');
            const isLast = state.currentIndex === questions.length - 1;
            nextBtnContainer.innerHTML = `
                <button onclick="nextQuestion()" class="flex items-center justify-center gap-2 bg-slate-900 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-slate-800 transition-all hover:scale-[1.02] active:scale-[0.98] shadow-lg fade-in">
                    <span>${isLast ? 'Finalizar' : 'Siguiente pregunta'}</span>
                    ${icons.chevronRight}
                </button>
            `;
        }

        function handleMultipleChoice(selectedOption, index) {
            if (state.isAnswered) return;
            const question = questions[state.currentIndex];
            const isCorrect = selectedOption === question.correctAnswer;
            
            question.options.forEach((opt, i) => {
                const btn = document.getElementById(`opt-${i}`);
                btn.disabled = true;
                btn.className = "w-full text-left p-4 rounded-xl border-2 transition-all duration-200 ";
                
                if (opt === question.correctAnswer) {
                    btn.className += "border-green-500 bg-green-50 text-green-800 font-medium";
                } else if (i === index && !isCorrect) {
                    btn.className += "border-red-500 bg-red-50 text-red-800 font-medium";
                } else {
                    btn.className += "border-slate-200 bg-white text-slate-400 opacity-50";
                }
            });

            completeQuestion(isCorrect);
        }

        function handleTrueFalse(selectedValue) {
            if (state.isAnswered) return;
            const question = questions[state.currentIndex];
            const isCorrect = selectedValue === question.correctAnswer;

            const btnTrue = document.getElementById('opt-true');
            const btnFalse = document.getElementById('opt-false');
            btnTrue.disabled = true;
            btnFalse.disabled = true;
            
            const updateBtn = (btn, isBtnVal) => {
                btn.className = "w-full text-center p-6 rounded-xl border-2 transition-all duration-200 text-lg font-medium ";
                if (isBtnVal === question.correctAnswer) {
                    btn.className += "border-green-500 bg-green-50 text-green-800";
                } else if (isBtnVal === selectedValue && !isCorrect) {
                    btn.className += "border-red-500 bg-red-50 text-red-800";
                } else {
                    btn.className += "border-slate-200 bg-white text-slate-400 opacity-50";
                }
            };

            updateBtn(btnTrue, true);
            updateBtn(btnFalse, false);
            
            completeQuestion(isCorrect);
        }

        function handleShortAnswer() {
            if (state.isAnswered) return;
            const question = questions[state.currentIndex];
            let allCorrect = true;

            question.inputs.forEach((input, index) => {
                const el = document.getElementById(`sa-${index}`);
                const val = el.value.trim().toLowerCase();
                const validAnswers = input.correctAnswers.map(a => a.toLowerCase());
                const isThisCorrect = validAnswers.includes(val);
                if (!isThisCorrect) allCorrect = false;

                el.disabled = true;
                el.className = "w-full p-4 rounded-xl border-2 outline-none transition-all duration-200 text-lg ";
                if (isThisCorrect) {
                    el.className += "border-green-500 bg-green-50 text-green-800";
                } else {
                    el.className += "border-red-500 bg-red-50 text-red-800";
                    el.insertAdjacentHTML('afterend', `<p class="text-sm text-red-600 pl-1 mt-1 fade-in">Respuesta esperada: ${input.correctAnswers[0]}</p>`);
                }
            });

            document.getElementById('sa-submit').style.display = 'none';
            completeQuestion(allCorrect);
        }

        function handleMatching() {
            if (state.isAnswered) return;
            const question = questions[state.currentIndex];
            
            for (let i = 0; i < question.pairs.length; i++) {
                const el = document.getElementById(`match-${i}`);
                if (!el.value) {
                    alert("Por favor, selecciona una definición para cada concepto.");
                    return;
                }
            }

            let allCorrect = true;

            question.pairs.forEach((pair, index) => {
                const el = document.getElementById(`match-${index}`);
                const isThisCorrect = el.value === pair.definition;
                if (!isThisCorrect) allCorrect = false;

                el.disabled = true;
                el.className = "w-full p-3 rounded-xl border-2 outline-none transition-all duration-200 text-sm ";
                if (isThisCorrect) {
                    el.className += "border-green-500 bg-green-50 text-green-800";
                } else {
                    el.className += "border-red-500 bg-red-50 text-red-800";
                    el.insertAdjacentHTML('afterend', `<p class="text-xs text-red-600 pl-1 mt-1 fade-in">Correcto: ${pair.definition}</p>`);
                }
            });

            document.getElementById('match-submit').style.display = 'none';
            completeQuestion(allCorrect);
        }

        function startQuiz() {
            state.status = 'playing';
            state.currentIndex = 0;
            state.score = 0;
            state.isAnswered = false;
            render();
        }

        function restartQuiz() {
            startQuiz();
        }

        function nextQuestion() {
            if (state.currentIndex < questions.length - 1) {
                state.currentIndex++;
                state.isAnswered = false;
                render();
            } else {
                state.status = 'finished';
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 300,
                        spread: 100,
                        origin: { y: 0.5 },
                        colors: ['#4f46e5', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6']
                    });
                }
                render();
            }
        }

        // Inicializar la aplicación
        render();
    </script>
</body>
</html>
